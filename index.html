<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>รักนะต้นเดือน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen tap story. A tear-off October calendar page sits mid-screen, a 1–31 day ruler runs above it,
   and a garden along the bottom gains one flower for every tap. */
:root{
  --bg:#FFEDF3;
  --bg-glow:#FFD3E2;
  --card:#FFFFFF;
  --ink:#5B1F3C;
  --ink-soft:#8A4C69;
  --band:#CF2F6C;
  --on-band:#FFFFFF;
  --petal-deep:#D4336F;
  --p1:#FF7FA9;
  --p2:#FFB1CB;
  --p3:#F0508F;
  --p4:#FF9C8F;
  --sun:#FFC857;
  --leaf:#5FA574;
  --grass:#A9D8B6;
  --tick:#F6C9D9;
  --perf:#F2BCD0;
  --shadow:rgba(207,47,108,.42);
  --display:'Itim','Mali','Sarabun','Thonburi','Tahoma',sans-serif;
  --ui:'Mali','Sarabun','Thonburi','Tahoma',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A0F20;
    --bg-glow:#4B1A39;
    --card:#3C1730;
    --ink:#FFE4EE;
    --ink-soft:#E7A9C2;
    --band:#FF6A9C;
    --on-band:#2A0F20;
    --petal-deep:#FF7BA6;
    --p1:#FF8FB5;
    --p2:#FFBAD0;
    --p3:#FF5E9B;
    --p4:#FFA799;
    --sun:#FFD98A;
    --leaf:#7CC092;
    --grass:#2F5B45;
    --tick:#5A2745;
    --perf:#6B2F52;
    --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A0F20;
  --bg-glow:#4B1A39;
  --card:#3C1730;
  --ink:#FFE4EE;
  --ink-soft:#E7A9C2;
  --band:#FF6A9C;
  --on-band:#2A0F20;
  --petal-deep:#FF7BA6;
  --p1:#FF8FB5;
  --p2:#FFBAD0;
  --p3:#FF5E9B;
  --p4:#FFA799;
  --sun:#FFD98A;
  --leaf:#7CC092;
  --grass:#2F5B45;
  --tick:#5A2745;
  --perf:#6B2F52;
  --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 50% 0%,var(--bg-glow) 0%,transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--ui);
}
*,*::before,*::after{box-sizing:border-box}

.stage{
  position:relative;min-height:100%;
  display:flex;flex-direction:column;overflow:hidden;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.gut{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.col{width:100%;max-width:420px;margin:0 auto}

/* day ruler */
.top{padding-block:18px 0}
.ruler{display:flex;align-items:flex-end;gap:3px;height:20px}
.ruler i{
  flex:1;min-width:0;height:7px;border-radius:4px;background:var(--tick);
  transition:background-color .3s ease,height .3s ease;
}
.ruler i.stop{height:12px}
.ruler i.on{background:var(--petal-deep)}
.ruler i.now{height:19px;background:var(--band)}
.ends{display:flex;justify-content:space-between;margin-top:6px;font:500 12px/1 var(--ui);color:var(--ink-soft)}

/* calendar page */
.scene{flex:1;display:flex;align-items:center;justify-content:center;padding-block:10px}
.page{
  position:relative;width:min(100%,360px);text-align:center;
  background:var(--card);border-radius:20px;
  box-shadow:0 18px 38px -18px var(--shadow);
}
.page.out{animation:pageOut .17s ease-in forwards}
.page.in{animation:pageIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageOut{to{opacity:0;transform:translateY(14px) rotate(-3deg) scale(.97)}}
@keyframes pageIn{from{opacity:0;transform:translateY(-8px) rotate(2deg) scale(.96)}}
.rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:center;gap:84px;z-index:2}
.rings i{width:10px;height:22px;border-radius:6px;background:var(--bg);border:2px solid var(--band)}
.band{
  position:relative;padding:12px 16px 10px;border-radius:20px 20px 0 0;
  background:var(--band);color:var(--on-band);
  font:600 15px/1.2 var(--ui);letter-spacing:.08em;
}
.body{padding:12px 22px 20px}
.dow{display:block;font:600 14px/1.3 var(--ui);letter-spacing:.06em;color:var(--ink-soft)}
.num{display:block;font:400 clamp(48px,9vh,92px)/1 var(--display);color:var(--petal-deep);margin-top:2px}
.perf{border-top:2px dashed var(--perf);margin:12px -22px}
.msg{min-height:clamp(116px,20vh,170px);display:flex;flex-direction:column;justify-content:center}
.line{margin:0;font:400 clamp(25px,7.2vw,33px)/1.28 var(--display);color:var(--ink);text-wrap:balance}
.sub{margin:8px 0 0;font:500 16px/1.6 var(--ui);color:var(--ink-soft);text-wrap:balance}
.note{margin:10px 0 0;font:600 15px/1.6 var(--ui);color:var(--ink-soft)}
.note .mini{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:6px;--c:var(--p1)}
.note .mini svg{display:block;width:100%;height:100%}

.page.finale .num{font-size:clamp(38px,6.5vh,60px)}
.page.finale .line{font-size:clamp(40px,12vw,52px);line-height:1.15;color:var(--petal-deep);animation:beat 2.6s ease-in-out infinite}
.page.finale .sub{margin-top:6px;font:400 clamp(24px,7vw,30px)/1.3 var(--display);color:var(--ink)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

/* controls */
.cta{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:12px}
.cta-row{display:flex;align-items:center;justify-content:center;gap:12px}
.next{
  position:relative;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;
  border:0;border-radius:999px;background:var(--band);color:var(--on-band);
  font:600 17px/1 var(--ui);cursor:pointer;box-shadow:0 10px 20px -10px var(--shadow);
  transition:transform .15s ease;
}
.next:active{transform:scale(.96)}
.next::after{
  content:"";position:absolute;inset:-5px;border-radius:inherit;border:2px solid var(--band);
  opacity:0;animation:ring 2.4s ease-out infinite;pointer-events:none;
}
@keyframes ring{0%{opacity:.55;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.back{
  display:grid;place-items:center;width:48px;height:48px;padding:0;border-radius:50%;
  border:2px solid var(--perf);background:transparent;color:var(--ink-soft);cursor:pointer;
}
.back:disabled{opacity:.35;cursor:default}
.next:focus-visible,.back:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hint{margin:0;font:500 12px/1.2 var(--ui);color:var(--ink-soft)}

/* garden */
.garden{
  --gh:clamp(150px,26vh,280px);
  --bw:min(clamp(50px,15vw,86px),calc(var(--gh) * .38));
  position:relative;flex:none;height:var(--gh);overflow:hidden;
}
.plot{position:relative;height:100%;max-width:640px;margin:0 auto}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--grass);z-index:3}
.ground::before{
  content:"";position:absolute;left:0;right:0;top:-11px;height:12px;
  background:radial-gradient(circle at 50% 100%,var(--grass) 0 11px,transparent 12px) 0 0/22px 12px repeat-x;
}
.bloom{
  position:absolute;left:var(--x);bottom:calc(var(--bz,0) * 1px);
  width:calc(var(--k,1) * var(--bw));
  transform:translateX(-50%);transform-origin:50% 100%;
}
.bloom.leaving{animation:leave .28s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-50%) scale(.3)}}
.bloom svg{
  display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;
  animation:sway calc(3.6s + var(--k,1) * 1s) ease-in-out calc(var(--d,0ms) + 1.3s) infinite alternate;
}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.stem{
  fill:none;stroke:var(--leaf);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:0;
  animation:stemGrow .7s ease-out var(--d,0ms) both;
}
@keyframes stemGrow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.lf{
  fill:var(--leaf);stroke:var(--ink);stroke-opacity:.12;stroke-width:1;
  transform-box:fill-box;
}
.lf1{transform-origin:100% 100%;animation:leafIn .5s ease-out calc(var(--d,0ms) + .35s) both}
.lf2{transform-origin:0% 100%;animation:leafIn .5s ease-out calc(var(--d,0ms) + .45s) both}
@keyframes leafIn{from{transform:scale(0)}to{transform:scale(1)}}
.head{transform-origin:50px 66px;animation:pop .7s cubic-bezier(.3,1.5,.5,1) calc(var(--d,0ms) + .5s) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0deg)}}
.pt{fill:var(--c);stroke:var(--ink);stroke-opacity:.16;stroke-width:1;stroke-linejoin:round}
.pt.hi{fill:var(--c);fill:color-mix(in srgb,var(--c) 68%,#fff)}
.ctr{fill:var(--sun);stroke:var(--ink);stroke-opacity:.2;stroke-width:1}

/* petals in the air */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.spark{
  position:absolute;width:9px;height:12px;margin:-6px 0 0 -4px;
  background:var(--pc);border-radius:80% 0 80% 0;animation:burst .9s ease-out forwards;
}
@keyframes burst{
  from{opacity:1;transform:translate(0,0) scale(.5) rotate(0deg)}
  to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r))}
}
.fall{
  position:absolute;left:var(--x);top:0;width:var(--w);height:calc(var(--w) * 1.35);
  background:var(--pc);border-radius:80% 0 80% 0;opacity:.9;
  animation:fall var(--dur) linear var(--dl) infinite;
  transform:translateY(-12vh);
}
@keyframes fall{
  0%{transform:translate(0,-12vh) rotate(0deg)}
  25%{transform:translate(var(--sw),25vh) rotate(90deg)}
  50%{transform:translate(calc(var(--sw) * -1),55vh) rotate(200deg)}
  75%{transform:translate(var(--sw),85vh) rotate(290deg)}
  100%{transform:translate(0,112vh) rotate(380deg)}
}

@media (prefers-reduced-motion: reduce){
  .stage *,.stage *::before,.stage *::after{animation:none!important;transition:none!important}
  .fall,.spark{display:none}
}
</style>

<div class="stage" id="stage" lang="th">
  <header class="top gut">
    <div class="col">
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <div class="ends" aria-hidden="true"><span>1 ต.ค.</span><span>31 ต.ค.</span></div>
    </div>
  </header>

  <main class="scene gut">
    <article class="page" id="page" aria-live="polite">
      <div class="rings" aria-hidden="true"><i></i><i></i></div>
      <div class="band">ตุลาคม 2569</div>
      <div class="body">
        <span class="dow" id="dow">วันพฤหัสบดี</span>
        <span class="num" id="num">1</span>
        <div class="perf" aria-hidden="true"></div>
        <div class="msg">
          <h1 class="line" id="line">รักนะต้นเดือน</h1>
          <p class="sub" id="sub">เริ่มเดือนนี้ด้วยความคิดถึง</p>
          <p class="note" id="note" hidden></p>
        </div>
      </div>
    </article>
  </main>

  <div class="cta gut">
    <div class="cta-row">
      <button class="back" id="back" type="button" aria-label="ย้อนกลับ" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="next" id="next" type="button">
        <span id="nextLabel">แตะเพื่อไปต่อ</span>
        <svg id="icoNext" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg id="icoRedo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
    </div>
    <p class="hint" id="hint">แตะตรงไหนของจอก็ได้</p>
  </div>

  <section class="garden" aria-hidden="true">
    <div class="plot gut" id="plot"></div>
    <div class="ground"></div>
  </section>
  <div class="fx" id="fx" aria-hidden="true"></div>
</div>

<script>
(function(){
  var DAYS=[1,4,8,12,16,20,24,27,30,31];
  var WD=["วันอาทิตย์","วันจันทร์","วันอังคาร","วันพุธ","วันพฤหัสบดี","วันศุกร์","วันเสาร์"];
  var SCENES=[
    {line:"รักนะต้นเดือน",sub:"เริ่มเดือนนี้ด้วยความคิดถึง"},
    {line:"รักนะตอนเช้า",sub:"ตื่นมาก็นึกถึงเลย"},
    {line:"รักนะวันที่เหนื่อย",sub:"เหนื่อยแค่ไหนก็ยังรักเหมือนเดิม"},
    {line:"รักนะตอนที่ยิ้ม",sub:"ยิ้มนั้นทำให้ทั้งวันดีขึ้นเสมอ"},
    {line:"รักนะกลางเดือน",sub:"มาไกลถึงครึ่งทางแล้วนะ"},
    {line:"ตุลาคมไม่ง่ายเลยใช่ไหม",sub:"แต่ก็ยังยืนอยู่ตรงนี้ได้"},
    {line:"รักนะทุกครั้งที่คิดถึง",sub:"คิดถึงบ่อยกว่าที่บอกอีกนะ"},
    {line:"ใกล้ถึงแล้วนะ",sub:"อีกนิดเดียวเอง ไหวนะ"},
    {line:"รักนะปลายเดือน",sub:"อีกวันเดียวก็ครบเดือนแล้ว"},
    {line:"รักนะเบ้บ",sub:"คิดถึงนะคะ",note:"เก่งมากๆ ที่ผ่านตุลาคมมาได้"}
  ];
  // x%, size, form, petal colour 1-4, lift in px
  var SPOTS=[
    [50,1.15,"daisy",1,0],[24,1.0,"blossom",2,4],[76,1.05,"tulip",3,2],[36,.9,"cosmos",4,8],
    [64,.95,"blossom",1,6],[12,.85,"daisy",3,10],[88,.9,"cosmos",2,8],[43,1.05,"tulip",2,0],
    [70,.85,"daisy",4,10],[30,1.1,"cosmos",1,2],
    [57,.8,"blossom",3,12],[18,.75,"tulip",4,12],[82,.8,"tulip",1,14],[6,.7,"blossom",1,14],
    [94,.7,"daisy",2,14],[47,.75,"cosmos",3,16],[66,.7,"tulip",3,16],[34,.7,"daisy",2,16],[78,.65,"blossom",4,18]
  ];
  var MAIN=10;
  var FORMS={
    daisy:{n:10,rx:5.6,ry:16,cy:-19,c:9},
    blossom:{n:5,rx:12.5,ry:15,cy:-14,c:6.5},
    cosmos:{n:8,rx:8,ry:17,cy:-19,c:6.5}
  };
  var TULIP='<path class="pt" d="M32 36C30 58 38 78 50 84C48 66 46 50 32 36Z"/>'
    +'<path class="pt" d="M68 36C70 58 62 78 50 84C52 66 54 50 68 36Z"/>'
    +'<path class="pt hi" d="M50 24C40 42 40 66 50 84C60 66 60 42 50 24Z"/>';

  var reduce=false;
  try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}

  function $(id){return document.getElementById(id);}
  var stage=$("stage"),page=$("page"),ruler=$("ruler"),plot=$("plot"),fx=$("fx");
  var dowEl=$("dow"),numEl=$("num"),lineEl=$("line"),subEl=$("sub"),noteEl=$("note");
  var backBtn=$("back"),nextLabel=$("nextLabel"),icoNext=$("icoNext"),icoRedo=$("icoRedo"),hint=$("hint");

  function petals(n,rx,ry,cy){
    var s="";
    for(var k=0;k<n;k++){
      s+='<ellipse class="pt" cx="0" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" transform="rotate('+(360/n*k).toFixed(1)+')"/>';
    }
    return s;
  }
  var MINI='<svg viewBox="-12 -12 24 24" aria-hidden="true">'+petals(6,3.2,5,-6.5)+'<circle class="ctr" r="2.6"/></svg>';

  function bloomSVG(form){
    var head,endY;
    if(form==="tulip"){
      head=TULIP;endY=86;
    }else{
      var f=FORMS[form];
      head='<g transform="translate(50 62)">'+petals(f.n,f.rx,f.ry,f.cy)+'<circle class="ctr" r="'+f.c+'"/></g>';
      endY=64;
    }
    return '<svg viewBox="0 0 100 200" aria-hidden="true" focusable="false">'
      +'<path class="stem" pathLength="1" d="M50 200C45 165 56 125 50 '+endY+'"/>'
      +'<path class="lf lf1" d="M50 168C34 164 24 150 24 138C38 140 50 150 50 168Z"/>'
      +'<path class="lf lf2" d="M50 146C66 142 76 128 76 116C62 118 50 128 50 146Z"/>'
      +'<g class="head">'+head+'</g></svg>';
  }

  /* ---- state ---- */
  var last=SCENES.length-1;
  var cur=0,locked=false,swapT=0,prevDay=1,falling=false;
  var blooms=[],ticks=[];

  /* ---- ruler ---- */
  var stops={};
  DAYS.forEach(function(d){stops[d]=1;});
  for(var d=1;d<=31;d++){
    var t=document.createElement("i");
    if(stops[d]) t.className="stop";
    ruler.appendChild(t);
    ticks.push(t);
  }
  function rulerTo(day){
    for(var k=0;k<ticks.length;k++){
      var on=(k+1)<=day;
      var delay=(on&&day>prevDay)?Math.max(0,(k+1-prevDay)*22):0;
      ticks[k].style.transitionDelay=delay+"ms";
      ticks[k].classList.toggle("on",on);
      ticks[k].classList.toggle("now",(k+1)===day);
    }
    prevDay=day;
  }

  /* ---- garden ---- */
  function makeBloom(n){
    var s=SPOTS[n],el=document.createElement("div");
    var dl=n>=MAIN?(n-MAIN)*130+250:0;
    el.className="bloom";
    el.style.cssText="--x:"+s[0]+"%;--k:"+s[1]+";--c:var(--p"+s[3]+");--bz:"+s[4]+";--d:"+dl+"ms";
    el.innerHTML=bloomSVG(s[2]);
    return el;
  }
  function burst(el){
    if(reduce||!el.isConnected) return;
    var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
    var cx=r.left+r.width/2-s.left,cy=r.top+r.height*0.31-s.top;
    for(var k=0;k<8;k++){
      var p=document.createElement("i");
      p.className="spark";
      var a=(Math.PI*2/8)*k+Math.random()*0.5,dist=34+Math.random()*30;
      p.style.cssText="left:"+cx+"px;top:"+cy+"px;--dx:"+(Math.cos(a)*dist).toFixed(1)+"px;--dy:"+(Math.sin(a)*dist-14).toFixed(1)+"px;--r:"+Math.round(Math.random()*360)+"deg;--pc:var(--p"+(1+k%4)+")";
      p.addEventListener("animationend",function(){this.remove();});
      fx.appendChild(p);
    }
  }
  function plantNext(){
    var n=blooms.length,el=makeBloom(n);
    plot.appendChild(el);
    blooms.push(el);
    if(n<MAIN&&!reduce) setTimeout(function(){burst(el);},560);
  }
  function removeBloom(el){
    el.classList.add("leaving");
    setTimeout(function(){el.remove();},300);
  }
  function syncGarden(){
    var want=cur===last?SPOTS.length:cur+1;
    while(blooms.length>want) removeBloom(blooms.pop());
    while(blooms.length<want) plantNext();
  }
  function startFall(){
    if(reduce||falling) return;
    falling=true;
    for(var k=0;k<26;k++){
      var p=document.createElement("i");
      p.className="fall";
      p.style.cssText="--x:"+(Math.random()*100).toFixed(1)+"%;--w:"+(9+Math.random()*9).toFixed(1)+"px;--dur:"+(7+Math.random()*6).toFixed(1)+"s;--dl:"+(Math.random()*5).toFixed(1)+"s;--sw:"+Math.round(15+Math.random()*35)+"px;--pc:var(--p"+(1+k%4)+")";
      fx.appendChild(p);
    }
  }
  function stopFall(){
    if(!falling) return;
    falling=false;
    var all=fx.querySelectorAll(".fall");
    for(var k=0;k<all.length;k++) all[k].remove();
  }

  /* ---- scenes ---- */
  function render(n){
    var sc=SCENES[n],day=DAYS[n];
    dowEl.textContent=WD[new Date(2026,9,day).getDay()];
    numEl.textContent=day;
    lineEl.textContent=sc.line;
    subEl.textContent=sc.sub;
    if(sc.note){
      noteEl.innerHTML='<span class="mini">'+MINI+'</span>';
      noteEl.appendChild(document.createTextNode(sc.note));
      noteEl.hidden=false;
    }else{
      noteEl.textContent="";
      noteEl.hidden=true;
    }
    page.classList.toggle("finale",n===last);
  }
  function chrome(n){
    var end=n===last;
    backBtn.disabled=n===0;
    nextLabel.textContent=end?"ย้อนดูอีกรอบ":"แตะเพื่อไปต่อ";
    icoNext.hidden=end;
    icoRedo.hidden=!end;
    if(end) hint.hidden=true;
  }
  function go(n){
    if(n<0||n>last||n===cur) return;
    cur=n;
    if(n!==0) hint.hidden=true;
    chrome(n);
    rulerTo(DAYS[n]);
    syncGarden();
    if(n===last) startFall(); else stopFall();
    if(reduce){render(n);return;}
    clearTimeout(swapT);
    page.classList.remove("in");
    page.classList.add("out");
    swapT=setTimeout(function(){
      render(n);
      page.classList.remove("out");
      void page.offsetWidth;
      page.classList.add("in");
    },170);
  }
  function lock(){
    locked=true;
    setTimeout(function(){locked=false;},reduce?0:400);
  }
  function next(){
    if(locked) return;
    lock();
    go(cur===last?0:cur+1);
  }
  function back(){
    if(locked) return;
    lock();
    go(cur-1);
  }

  stage.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest("#back")){back();return;}
    if(cur===last&&!t.closest("#next")) return;
    next();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"&&cur<last) next();
    else if(e.key==="ArrowLeft") back();
  });

  render(0);
  chrome(0);
  rulerTo(1);
  syncGarden();
})();
</script>

</body></html>
